version: "3"

tasks:
  test:
    desc: Run tests
    cmds:
      - |
        PY=python3
        [ -x .venv/bin/python ] && PY=.venv/bin/python
        $PY -m pytest tests/ -v

  test:coverage:
    desc: Run tests with coverage (fail under 90%)
    cmds:
      - |
        PY=python3
        [ -x .venv/bin/python ] && PY=.venv/bin/python
        $PY -m pytest tests/ --cov=podcastify --cov-report=term-missing --cov-fail-under=90 -v

  setup:
    desc: Create .venv, install runtime and dev requirements, and install git hooks
    cmds:
      - '[ -d .venv ] || python3 -m venv .venv'
      - .venv/bin/python -m pip install -r requirements.txt -r requirements-dev.txt
      - task: hooks

  validate:
    desc: Run coverage tests and quick Docker build
    cmds:
      - task: test:coverage
      - task: :docker:build:quick

  hooks:
    desc: Install git hooks (Conventional Commits check on commit-msg)
    cmds:
      - |
        PY=python3
        [ -x .venv/bin/python ] && PY=.venv/bin/python
        $PY -m pre_commit install

  smoke:
    desc: Build the image and smoke test it (health, feed, media, dropped user)
    cmds:
      - docker build -t podcastify:smoke -f docker/podcastify/Dockerfile .
      - tasks/smoke.sh podcastify:smoke
