version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    groups:
      python:
        patterns:
          - "*"
        exclude-patterns:
          - "tinytag"
      tinytag:
        patterns:
          - "tinytag"

  - package-ecosystem: docker
    directory: /docker/podcastify
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    groups:
      docker:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      pre-commit:
        patterns:
          - "*"
