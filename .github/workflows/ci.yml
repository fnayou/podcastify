name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: fnayou/podcastify

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  test:
    needs: [tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require tests to pass
        env:
          RESULT: ${{ needs.tests.result }}
        run: test "$RESULT" = success

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      - name: Detect docs-only changes
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          docker=true
          if [ "$EVENT_NAME" = pull_request ]; then
            docker=false
            while IFS= read -r f; do
              case "$f" in
                docs/*|*.md|.github/ISSUE_TEMPLATE/*) ;;
                *) docker=true ;;
              esac
            done <<< "$(git diff --name-only HEAD^1 HEAD)"
          fi
          echo "docker=${docker}" >> "$GITHUB_OUTPUT"

  docker:
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.docker != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=podcastify
            org.opencontainers.image.description=tiny self-hosted podcast RSS generator. Create private podcast feeds from your own MP3s with zero fuss.
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}

      - name: Build (PR, no push)
        id: build-pr
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/podcastify/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: local/podcastify:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Note about forked PRs (no Docker Hub secrets)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true
        run: echo "Skipping Docker Scout on forked PRs (no secrets). Trivy still runs."

      - name: Login to Docker Hub (PR, same-repo only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Scout (PR)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        id: docker-scout
        continue-on-error: true
        uses: docker/scout-action@a4119c5a8c5076236a54e4ce99531f7e4dd2ef84 # v1.27.0
        with:
          command: cves
          image: local://local/podcastify:${{ github.sha }}
          only-severities: critical,high
          only-fixed: true
          summary: true
          write-comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sarif-file: docker-scout.sarif

      - name: Upload SARIF (Scout, PR)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          sarif_file: docker-scout.sarif

      - name: Trivy scan (PR, non-blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "local/podcastify:${{ github.sha }}"
          format: "table"
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "0"
          hide-progress: true

      - name: Trivy SARIF (PR)
        id: sarif-pr
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "local/podcastify:${{ github.sha }}"
          format: "sarif"
          output: "trivy-results.sarif"
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH,MEDIUM,LOW"
          ignore-unfixed: true
          hide-progress: true

      - name: Upload SARIF (Trivy, PR)
        if: steps.sarif-pr.outcome == 'success'
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          sarif_file: "trivy-results.sarif"
