name: Release
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE_NAME: fnayou/podcastify
  IMAGE_DESCRIPTION: "Tiny self-hosted podcast RSS generator: private feeds from your own audio files."

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate CalVer tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PATTERN='^v20[0-9]{2}\.([1-9]|1[0-2])\.(0|[1-9][0-9]*)(-[0-9A-Za-z.]+)?$'
          if [[ ! "${TAG}" =~ ${PATTERN} ]]; then
            echo "::error::Tag '${TAG}' is not a CalVer release tag. Expected vYYYY.M.PATCH (month without zero padding), optionally followed by -rc.N, for example v2026.10.0 or v2026.10.0-rc.1."
            exit 1
          fi

  notes-check:
    needs: [validate-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (full history for the notes)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Notes range
        id: range
        shell: bash
        run: echo "args=$(sh tasks/release_range.sh "${GITHUB_REF_NAME}" f1e964de)" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: v2.14.2
          config: cliff.toml
          args: --output release-notes.md ${{ steps.range.outputs.args }}

      - name: Check the notes are not empty
        shell: bash
        run: |
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::git-cliff produced no release notes for ${GITHUB_REF_NAME}. Check that the range holds feat, fix, perf, build or revert commits, or breaking changes."
            exit 1
          fi

  test:
    needs: [notes-check]
    uses: ./.github/workflows/test.yml

  docker:
    needs: [test, notes-check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      digest: ${{ steps.build-push.outputs.digest }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IS_PRERELEASE="$([[ "${GITHUB_REF_NAME}" == *-* ]] && echo true || echo false)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=podcastify
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}

      - name: Build for scan (amd64, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/podcastify/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: local/podcastify:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (blocking on CRITICAL and HIGH)
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "local/podcastify:${{ github.sha }}"
          format: "json"
          output: "trivy-results.json"
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true

      - name: Trivy report (table and SARIF from the same scan)
        if: ${{ !cancelled() && hashFiles('trivy-results.json') != '' }}
        shell: bash
        run: |
          trivy convert --format table --output trivy-results.txt trivy-results.json
          cat trivy-results.txt
          { echo '```'; cat trivy-results.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          trivy convert --format sarif --output trivy-results.sarif trivy-results.json

      - name: Upload SARIF (Trivy)
        if: ${{ !cancelled() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: "trivy-results.sarif"

      - name: Push (multi-arch, amd64 from the scanned build cache)
        id: build-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/podcastify/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Sync Docker Hub overview (stable releases, never blocks)
        if: ${{ !contains(github.ref_name, '-') }}
        continue-on-error: true
        timeout-minutes: 5
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE_NAME }}
          readme-filepath: README.md
          short-description: ${{ env.IMAGE_DESCRIPTION }}

  release:
    runs-on: ubuntu-latest
    needs: [docker]
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout (full history for the notes)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Notes range
        id: range
        shell: bash
        run: echo "args=$(sh tasks/release_range.sh "${GITHUB_REF_NAME}" f1e964de)" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: v2.14.2
          config: cliff.toml
          args: --output release-notes.md ${{ steps.range.outputs.args }}

      - name: Compose the release body
        shell: bash
        env:
          VERSION: ${{ needs.docker.outputs.version }}
          DIGEST: ${{ needs.docker.outputs.digest }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo '## Docker Image'
            echo '```'
            echo "docker pull ${IMAGE_NAME}:${VERSION}"
            echo '```'
            echo
            echo 'Immutable reference:'
            echo '```'
            echo "docker pull ${IMAGE_NAME}@${DIGEST}"
            echo '```'
            echo
            echo 'Verify the signed provenance:'
            echo '```'
            echo "gh attestation verify oci://${REGISTRY}/${IMAGE_NAME}:${VERSION} --repo ${REPO}"
            echo '```'
            echo
            echo '## Release Notes'
            cat release-notes.md
            echo
            echo '## Artifacts'
            echo '- Multi-arch: linux/amd64, linux/arm64'
            echo '- SBOM and provenance attached'
          } > release-body.md

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: release-body.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
