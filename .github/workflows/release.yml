name: Release
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE_NAME: fnayou/podcastify

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate CalVer tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PATTERN='^v20[0-9]{2}\.([1-9]|1[0-2])\.(0|[1-9][0-9]*)(-[0-9A-Za-z.]+)?$'
          if [[ ! "${TAG}" =~ ${PATTERN} ]]; then
            echo "::error::Tag '${TAG}' is not a CalVer release tag. Expected vYYYY.M.PATCH (month without zero padding), optionally followed by -rc.N, for example v2026.10.0 or v2026.10.0-rc.1."
            exit 1
          fi

  test:
    needs: [validate-tag]
    uses: ./.github/workflows/test.yml

  docker:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      digest: ${{ steps.build-push.outputs.digest }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IS_PRERELEASE="$([[ "${GITHUB_REF_NAME}" == *-* ]] && echo true || echo false)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=podcastify
            org.opencontainers.image.description=tiny self-hosted podcast RSS generator. Create private podcast feeds from your own MP3s with zero fuss.
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}

      - name: Build for scan (amd64, no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/podcastify/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: local/podcastify:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (blocking on CRITICAL and HIGH)
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "local/podcastify:${{ github.sha }}"
          format: "json"
          output: "trivy-results.json"
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true

      - name: Trivy report (table and SARIF from the same scan)
        if: ${{ !cancelled() && hashFiles('trivy-results.json') != '' }}
        shell: bash
        run: |
          trivy convert --format table --output trivy-results.txt trivy-results.json
          cat trivy-results.txt
          { echo '```'; cat trivy-results.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          trivy convert --format sarif --output trivy-results.sarif trivy-results.json

      - name: Upload SARIF (Trivy)
        if: ${{ !cancelled() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          sarif_file: "trivy-results.sarif"

      - name: Push (multi-arch, amd64 from the scanned build cache)
        id: build-push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/podcastify/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  release:
    runs-on: ubuntu-latest
    needs: [docker]
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Extract changelog section
        id: changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          START_MARKER="## ${GITHUB_REF_NAME}"
          END_MARKER="^## [a-zA-Z0-9]"

          CHANGELOG=$(awk "
            /^${START_MARKER}/ { found=1; next }
            found && /${END_MARKER}/ { exit }
            found
          " CHANGELOG.md)

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="See CHANGELOG.md for details."
          fi

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Docker Image
            ```
            docker pull ${{ env.IMAGE_NAME }}:${{ needs.docker.outputs.version }}
            ```

            Immutable reference:
            ```
            docker pull ${{ env.IMAGE_NAME }}@${{ needs.docker.outputs.digest }}
            ```

            Verify the signed provenance:
            ```
            gh attestation verify oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.docker.outputs.version }} --repo ${{ github.repository }}
            ```

            ## Release Notes
            ${{ steps.changelog.outputs.changelog }}

            ## Artifacts
            - Multi-arch: linux/amd64, linux/arm64
            - SBOM and provenance attached
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
