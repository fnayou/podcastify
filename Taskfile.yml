version: "3"

dotenv: [".env", ".env.local"]

vars:
  COMPOSE: docker compose
  SERVICE_NAME: podcastify
  APP_SCRIPT: /app/app.py
  PUBLIC_DIR: ./public
  PODCASTS_DIR: ./podcasts
  LOG_LINES: 200

includes:
  docker:
    taskfile: ./tasks/docker.yml
  podcastify:
    taskfile: ./tasks/podcastify.yml
  dev:
    taskfile: ./tasks/dev.yml
  devlocal:
    taskfile: ./Taskfile.dev.yml
    optional: true

tasks:
  default:
    desc: Show all available tasks
    silent: true
    cmds:
      - |
        echo "Podcastify - development tasks"
        echo "=============================="
        echo "End users: use the Docker image only (see README / deployment guide)."
        echo
        task --list
        echo
        echo "Use: task <namespace>:<task>  (e.g. task docker:up, task podcastify:generate)"

  info:
    desc: Show system and project information
    silent: true
    cmds:
      - |
        echo "System information"
        echo "=================="
        echo 'Docker Compose: {{ .COMPOSE }}'
        echo 'Service Name: {{ .SERVICE_NAME }}'
        echo 'Public Directory: {{ .PUBLIC_DIR }}'
        echo 'Podcasts Directory: {{ .PODCASTS_DIR }}'
        echo
        echo "Directory status:"
        if [ -d '{{.PUBLIC_DIR}}' ]; then echo "Public dir: OK"; else echo "Public dir: missing"; fi
        if [ -d '{{.PODCASTS_DIR}}' ]; then echo "Podcasts dir: OK"; else echo "Podcasts dir: missing"; fi
        echo
        echo "Docker status:"
        {{.COMPOSE}} ps {{.SERVICE_NAME}} 2>/dev/null || echo "Service not running"

  health:
    desc: Run health check (info + compose status)
    silent: true
    cmds:
      - |
        echo "Health check"
        echo "============"
        task info
        echo

  version:
    desc: Show tool and project file versions
    silent: true
    cmds:
      - |
        echo "Version information"
        echo "==================="
        task --version
        docker --version
        {{.COMPOSE}} version || true
        echo
        echo "Project files:"
        test -f Taskfile.yml && echo "Taskfile.yml: OK" || echo "Taskfile.yml: missing"
        test -f docker-compose.yml && echo "docker-compose.yml: OK" || echo "docker-compose.yml: missing"

  doctor:
    desc: Check required tools and directories
    silent: true
    cmds:
      - |
        ok=1
        for bin in docker task grep python3; do
          command -v "$bin" >/dev/null 2>&1 || { echo "Missing: $bin"; ok=0; }
        done
        {{.COMPOSE}} version >/dev/null 2>&1 || { echo "Problem with docker compose"; ok=0; }
        command -v ffprobe >/dev/null 2>&1 || echo "Note: ffprobe not on host (optional; used in container)"
        [ -d "{{.PUBLIC_DIR}}" ]   || { echo "Missing dir: {{.PUBLIC_DIR}}"; ok=0; }
        [ -d "{{.PODCASTS_DIR}}" ] || { echo "Missing dir: {{.PODCASTS_DIR}}"; ok=0; }
        [ $ok -eq 1 ] && echo "All good" || exit 1
