# Rendered by entrypoint.sh to /tmp/nginx/nginx.conf: __SERVICE_PORT__ becomes
# $SERVICE_PORT. Everything nginx writes lives under /tmp/nginx so the root
# filesystem can be read-only and the process can run as any uid.
daemon off;
pid /tmp/nginx/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    absolute_redirect off;
    sendfile on;
    # A FIFO that entrypoint.sh copies to stdout: after su-exec the container's
    # stdout pipe is root-owned, so nginx cannot open /dev/stdout itself.
    access_log /tmp/nginx/access.log;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/xml application/rss+xml application/json;

    # One add_header at server level: nginx drops inherited headers as soon as a
    # location sets its own. An empty value is not sent.
    map $uri $podcastify_cache_control {
        default "";
        ~*\.xml$ "public, max-age=300, must-revalidate";
        ~*\.mp3$ "public, max-age=86400";
        ~*\.(jpg|jpeg|png|webp)$ "public, max-age=86400";
    }

    server {
        listen __SERVICE_PORT__;
        server_name _;
        root /app/public;

        add_header Access-Control-Allow-Origin "*" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control $podcastify_cache_control always;

        # A directory without index.html answers 403 in nginx; the site answers 404.
        error_page 403 = @not_found;
        location @not_found {
            return 404;
        }

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok";
        }

        # The generator's temp files and the like are dotfiles.
        location ~ /\. {
            return 404;
        }

        location ~* \.xml$ {
            types { application/rss+xml xml; }
            charset utf-8;
            charset_types application/rss+xml;
        }
    }
}
