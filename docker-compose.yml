services:
  podcastify:
    build:
      context: .
      dockerfile: docker/podcastify/Dockerfile

    restart: unless-stopped

    ports:
      - "${HOST_PORT:-8080}:${SERVICE_PORT:-8080}"

    environment:
      - SERVICE_PORT
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:${HOST_PORT:-8080}}
      - RUN_ON_START
      - GENERATE_INTERVAL
      - PUBLISH_XML
      - LOG_LEVEL
      # Set to the uid/gid that owns the bind-mounts below so generated
      # files aren't written as root. Defaults to 1000.
      - PUID
      - PGID

    volumes:
      - ./public:/app/public
      - ./podcasts:/app/podcasts
      - ./cache:/app/.cache
